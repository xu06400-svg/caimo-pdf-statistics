<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>彩膜 PDF 领料统计</title><style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#223349;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{padding:20px 35px;background:#173c5b;color:white;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:22px;margin:0}.top small{opacity:.72}.layout{max-width:1500px;margin:26px auto;padding:0 22px}.panel{background:white;border:1px solid #e4eaf1;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #20375009}h2{font-size:17px;margin:0 0 15px}.upload{border:2px dashed #adc4d7;background:#f8fbff;padding:24px;text-align:center;border-radius:10px;cursor:pointer}.upload:hover{background:#eef6ff}.upload strong{display:block;margin-bottom:7px}button,.button{background:#1766a4;color:white;border:0;border-radius:7px;padding:10px 17px;cursor:pointer;font-size:14px}button.secondary{background:#edf3f8;color:#31506a}button.danger{background:#fff1f1;color:#af3030;padding:5px 9px}button:disabled{opacity:.5;cursor:wait}input{border:1px solid #d2dce5;border-radius:7px;padding:9px 10px;min-width:120px;width:100%;font:inherit}label{font-size:12px;color:#64758a;display:grid;gap:5px}.filters{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px}.actions{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{padding:18px 20px;background:white;border:1px solid #e4eaf1;border-radius:12px}.stat span{color:#70849a;font-size:13px}.stat b{display:block;font-size:26px;margin-top:6px}.tablewrap{width:100%;overflow:auto;max-height:65vh;border:1px solid #e8edf1;border-radius:8px}table{border-collapse:separate;border-spacing:0;white-space:nowrap;font-size:13px;width:100%}td,th{padding:10px 12px;border-bottom:1px solid #e9eef4;border-right:1px solid #edf1f5;text-align:left}th{position:sticky;top:0;z-index:1;background:#eff5fa;color:#34536c}tbody tr:nth-child(even){background:#fafcfe}tbody tr:hover{background:#eaf4fd}.number{text-align:right;font-variant-numeric:tabular-nums}.note{color:#748397;font-size:12px}.status{padding:10px 0;color:#32648a;white-space:pre-wrap}.files{display:flex;flex-wrap:wrap;gap:8px}.filechip{border:1px solid #dce6ed;background:#fafcff;padding:7px 9px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:8px}@media(max-width:820px){.filters{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.top{padding:16px}.layout{padding:0 10px}}
</style></head><body><header class="top"><h1>彩膜领料 · PDF 数据统计</h1><small>PDF → 网页 Excel 明细表</small></header><main class="layout">
<section class="panel"><h2>① 上传 PDF 领料单</h2><div id="drop" class="upload" onclick="document.getElementById('pdf').click()"><strong>点击选择 / 拖拽多份 PDF 文件到这里</strong><span class="note">支持批量上传；同名 PDF 再上传将自动覆盖原明细，避免重复统计</span></div><input id="pdf" type="file" accept="application/pdf" multiple hidden><div id="status" class="status"></div><div id="files" class="files"></div></section>
<section class="panel"><h2>② 日期与订单筛选</h2><div class="filters"><label>开始日期<input type="date" id="start"></label><label>结束日期<input type="date" id="end"></label><label>销售订单号<input id="order" placeholder="输入订单号"></label><label>物料编号<input id="material" placeholder="输入料号"></label><label>调拨单号<input id="document" placeholder="输入单号"></label></div><div class="actions"><button onclick="refresh()">筛选查询</button><button class="secondary" onclick="resetFilters()">清空筛选</button><button onclick="downloadXlsx()">导出当前结果 Excel</button><span class="note">日期范围包含起止两天</span></div></section>
<div class="stats"><div class="stat"><span>领料明细</span><b id="count">0</b></div><div class="stat"><span>调拨单据</span><b id="documents">0</b></div><div class="stat"><span>销售订单</span><b id="orders">0</b></div><div class="stat"><span>申请总数量（米）</span><b id="total">0</b></div></div>
<section class="panel"><h2>③ 网页 Excel 明细表</h2><div class="tablewrap"><table><thead><tr><th>单据日期</th><th>调拨单号</th><th>行号</th><th>料号</th><th>品名</th><th>规格</th><th class="number">申请数量</th><th>单位</th><th>生产订单号</th><th>销售订单号</th><th>PDF 来源</th></tr></thead><tbody id="rows"><tr><td colspan="11">请先上传 PDF 文件</td></tr></tbody></table></div><p class="note">本版统计 PDF「申请数量」，不等于实际出库量。表格可复制单元格文本；支持筛选并导出 Excel。</p></section></main>
<script>
const $=id=>document.getElementById(id);const keys=['date','document','line_no','material_code','item_name','specification','quantity','unit','production_no','sales_order','source_file'];
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function params(){const p=new URLSearchParams();['start','end','order','material','document'].forEach(k=>{if($(k).value)p.set(k,$(k).value)});return p}
async function refresh(){try{const x=await(await fetch('/api/rows?'+params())).json();['count','documents','orders'].forEach(k=>$(k).textContent=x[k]);$('total').textContent=x.total.toLocaleString('zh-CN',{maximumFractionDigits:6});$('rows').innerHTML=x.rows.length?x.rows.map(r=>'<tr>'+keys.map(k=>'<td class="'+(k==='quantity'?'number':'')+'">'+esc(r[k])+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="11">没有匹配的记录</td></tr>';await refreshFiles()}catch(e){$('status').textContent='查询出错：'+e.message}}
function resetFilters(){['start','end','order','material','document'].forEach(k=>$(k).value='');refresh()}
function downloadXlsx(){location.href='/api/export?'+params()}
async function refreshFiles(){const x=await(await fetch('/api/files')).json();$('files').innerHTML=x.files.map(f=>`<span class="filechip">📄 ${esc(f.source_file)}（${f.count}行）<button class="danger" data-remove="${esc(f.source_file)}">删除</button></span>`).join('')}
async function removeFile(name){if(!confirm('删除该文件的全部领料记录？'))return;await fetch('/api/files/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});refresh()}
async function upload(files){if(!files.length)return;const form=new FormData();for(let f of files)form.append('files',f);$('status').textContent='正在解析 '+files.length+' 个 PDF 文件…';try{let response=await fetch('/api/upload',{method:'POST',body:form});let x=await response.json();$('status').textContent=`成功导入 ${x.added} 行，${x.files.length} 份 PDF。`+(x.warnings.length?'\n提示：'+x.warnings.join('\n'):'');refresh()}catch(e){$('status').textContent='上传失败：'+e.message}}
$('files').addEventListener('click',e=>{if(e.target.matches('[data-remove]'))removeFile(e.target.getAttribute('data-remove'))});$('pdf').addEventListener('change',e=>{upload(e.target.files);e.target.value=''});$('drop').addEventListener('dragover',e=>{e.preventDefault();e.currentTarget.style.background='#e6f4ff'});$('drop').addEventListener('dragleave',e=>e.currentTarget.style.background='');$('drop').addEventListener('drop',e=>{e.preventDefault();e.currentTarget.style.background='';upload(e.dataTransfer.files)});refresh();
</script></body></html>
